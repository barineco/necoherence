[package]
name = "necoherence-verification"
version = "0.3.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Cross-node verification for necoherence"
rust-version = "1.88"
publish = false

[lib]
name = "necoherence_verification"
path = "src/lib.rs"

[dependencies]
necoherence = { version = "0.3.0", path = "../../packages/rust/adapter" }
necoherence-generator = { version = "0.3.0", path = "../../generator/rust" }
necoherence-solver = { version = "0.3.0", path = "../../solver/rust" }
necoherence-composition-solver = { version = "0.3.0", path = "../../solver/composition/rust" }
num-bigint = "0.4"
num-traits = "0.2"
serde_json = { version = "1", features = ["arbitrary_precision"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"

