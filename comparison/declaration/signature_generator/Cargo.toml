[package]
name = "signature_generator"
version = "0.2.0"
edition = "2021"
publish = false

[[bin]]
name = "signatures"
path = "src/main.rs"

[dependencies]
necoherence = { path = "../../../rust" }
necoherence-tools = { path = "../../../tools/rust" }
num-bigint = "0.4"
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
