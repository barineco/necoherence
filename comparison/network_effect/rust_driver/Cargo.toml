[package]
name = "host_failure_driver"
version = "0.2.2"
edition = "2021"
publish = false

[[bin]]
name = "host_failure_driver"
path = "src/main.rs"

[dependencies]
necoherence = { path = "../../../rust", features = ["http-adapter"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
