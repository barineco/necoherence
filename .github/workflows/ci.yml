# SPDX-License-Identifier: MIT

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Remove the tools to build the MIT package alone
        run: rm -rf generator solver verification/rust verification/lean
      - name: Set up Lean
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: packages/lean
      - name: Build and run theorem tests
        working-directory: packages/lean
        run: |
          lake build
          lake env lean --run Tests/ProofCompleteness.lean
          lake env lean --run Tests/ExactJsonCodec.lean
          lake env lean --run Tests/GraphemeProfileVectors.lean
          lake env lean --run Tests/WrapperBase64Vectors.lean
          lake env lean --run Tests/SealedLeafSampleVectors.lean
          LEAN_NUM_THREADS=2 lake env lean --run Tests/FormatEvaluation.lean
          lake env lean --run Tests/ObjectClassification.lean
          lake env lean --run Tests/UnionAndDomainDeclarations.lean
          lake env lean --run Tests/InclusionAndSamples.lean
          lake env lean --run Tests/ProfileWireAndChecks.lean
          lake env lean --run Tests/ProfileAndLibraryPredicates.lean

  python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Remove the tools to build the MIT package alone
        run: rm -rf generator solver verification/rust verification/lean
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: packages/python/adapter/pyproject.toml
      - name: Install neco-quotient packages from PyPI
        run: |
          python -m pip install "neco-quotient-certificate==0.2.0" "neco-quotient-application==0.1.0" "neco-quotient-retention==0.1.0" "neco-quotient-encoding==0.1.0"
      - name: Install build and test dependencies
        working-directory: packages/python/adapter
        run: python -m pip install build .[dev]
      - name: Test and type-check
        working-directory: packages/python/adapter
        run: |
          python -m pytest -q
          python -m mypy src tests
      - name: Build the wheel and test it in a clean environment
        working-directory: packages/python/adapter
        run: |
          python -m build
          python -m venv .clean-install
          .clean-install/bin/python -m pip install dist/*.whl pytest hypothesis
          .clean-install/bin/python -c "import necoherence, sysconfig; assert necoherence.__file__.startswith(sysconfig.get_paths()['purelib']), necoherence.__file__"
          .clean-install/bin/python -m pytest -q -p no:cacheprovider -o pythonpath=
          .clean-install/bin/python -c "import zipfile; wheel=next(__import__('pathlib').Path('dist').glob('*.whl')); names=set(zipfile.ZipFile(wheel).namelist()); assert 'necoherence/README.md' in names, names"
      - name: Build and test the separate HTTP adapter
        working-directory: packages/python/adapter/http
        run: |
          python -m pip install .. '.[dev]'
          python -m pytest -q
          python -m mypy src tests
          python -m build
          python -m venv .clean-install
          .clean-install/bin/python -m pip install ../dist/*.whl dist/*.whl pytest
          .clean-install/bin/python -m pytest -q -p no:cacheprovider -o pythonpath=

  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Remove the tools to build the MIT package alone
        run: rm -rf generator solver verification/rust verification/lean
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Check, test, and package
        working-directory: packages/rust/adapter
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test --all-targets
          cargo check --lib --target wasm32-unknown-unknown --no-default-features
          cargo package
          cargo package --list | grep -qx README.md
      - name: Check, test, and package the HTTP adapter
        working-directory: packages/rust/adapter/http
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test
          cargo package --config "patch.crates-io.necoherence.path=\"${{ github.workspace }}/packages/rust/adapter\""
          cargo package --list | grep -qx README.md

  typescript:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Remove the tools to build the MIT package alone
        run: rm -rf generator solver verification/rust verification/lean
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: packages/typescript/adapter/package-lock.json
      - name: Install dependencies
        working-directory: packages/typescript/adapter
        run: npm ci
      - name: Type-check, test, and verify the package consumer
        working-directory: packages/typescript/adapter
        run: |
          npm run typecheck
          npm run lint
          npm test
          npx tsx --test "$GITHUB_WORKSPACE/verification/network_effect/ts_runner.test.mts"
          npm run verify:consumer
          npm pack --json > pack.json
          python -c "import json, tarfile; name=json.load(open('pack.json'))[0]['filename']; names=set(tarfile.open(name).getnames()); assert 'package/README.md' in names, names"
      - name: Build and test the separate HTTP adapter
        working-directory: packages/typescript/adapter/http
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm pack

  java:
    runs-on: ubuntu-latest
    env:
      NCOH_NECO_QUOTIENT_JAVA: ${{ github.workspace }}/../neco-quotient-certificate-0.2.0-sources
      NCOH_NECO_QUOTIENT_APPLICATION_JAVA: ${{ github.workspace }}/../neco-quotient-application-sources
      NCOH_NECO_QUOTIENT_RETENTION_JAVA: ${{ github.workspace }}/../neco-quotient-retention-sources
      NCOH_NECO_QUOTIENT_ENCODING_JAVA: ${{ github.workspace }}/../neco-quotient-encoding-sources
      NCOH_JAVAC_FLAGS: >-
        -Xlint:all -Werror -XDcompilePolicy=simple -XDshould-stop.ifError=FLOW
        -XDaddTypeAnnotationsToSymbol=true
        -J--add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED
        -J--add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED
        -J--add-exports=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED
        -J--add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED
        -J--add-exports=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED
        -J--add-exports=jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED
        -J--add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED
        -J--add-exports=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED
        -J--add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED
        -J--add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED
        -processorpath ${{ github.workspace }}/packages/java/adapter/lib/error_prone_core-2.51.0-with-dependencies.jar
      NCOH_ERROR_PRONE_PLUGIN: "-Xplugin:ErrorProne -XepDisableAllChecks -Xep:BanJNDI:ERROR -Xep:DoNotCall:ERROR -Xep:CatchFail:ERROR -Xep:CheckReturnValue:ERROR"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Fetch the neco-quotient Java sources from Maven Central
        run: |
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/neco-quotient-certificate-0.2.0-sources.jar" \
            https://repo1.maven.org/maven2/io/github/barineco/neco-quotient-certificate/0.2.0/neco-quotient-certificate-0.2.0-sources.jar
          printf '%s  %s\n' dd477ac74974b3a676dd719cefdffe68f44bfb105025cb12282916efa6020e98 \
            "$RUNNER_TEMP/neco-quotient-certificate-0.2.0-sources.jar" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/neco-quotient-certificate-0.2.0-sources.jar" -d "$NCOH_NECO_QUOTIENT_JAVA"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/neco-quotient-application-0.1.0-sources.jar" \
            https://repo1.maven.org/maven2/io/github/barineco/neco-quotient-application/0.1.0/neco-quotient-application-0.1.0-sources.jar
          printf '%s  %s\n' 15f64a3fa26e07015adfca6f6c16320accdedca33b080bdf4a236a049cd81e41 \
            "$RUNNER_TEMP/neco-quotient-application-0.1.0-sources.jar" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/neco-quotient-application-0.1.0-sources.jar" -d "$NCOH_NECO_QUOTIENT_APPLICATION_JAVA"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/neco-quotient-retention-0.1.0-sources.jar" \
            https://repo1.maven.org/maven2/io/github/barineco/neco-quotient-retention/0.1.0/neco-quotient-retention-0.1.0-sources.jar
          printf '%s  %s\n' 7c514b0cb42d2f10a11e398be7a01e8aabb4bab867132c4fec18e160e01dfb5b \
            "$RUNNER_TEMP/neco-quotient-retention-0.1.0-sources.jar" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/neco-quotient-retention-0.1.0-sources.jar" -d "$NCOH_NECO_QUOTIENT_RETENTION_JAVA"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/neco-quotient-encoding-0.1.0-sources.jar" \
            https://repo1.maven.org/maven2/io/github/barineco/neco-quotient-encoding/0.1.0/neco-quotient-encoding-0.1.0-sources.jar
          printf '%s  %s\n' b58874a0c5131b2eceb649ff757befe30fa0c36856528c28635aab2b62c67e46 \
            "$RUNNER_TEMP/neco-quotient-encoding-0.1.0-sources.jar" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/neco-quotient-encoding-0.1.0-sources.jar" -d "$NCOH_NECO_QUOTIENT_ENCODING_JAVA"
      - name: Remove the tools to build the MIT package alone
        run: rm -rf generator solver verification/rust verification/lean
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: x
      - name: Build the jar and test it
        working-directory: packages/java/adapter
        run: |
          mkdir -p lib build/classes build/test-classes
          curl --fail --location --silent --show-error \
            --output lib/junit-platform-console-standalone-1.10.2.jar \
            https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/1.10.2/junit-platform-console-standalone-1.10.2.jar
          printf '%s  %s\n' \
            a1de557821293ce903c213c694165fff532cf92081bac4238b9e05b35f04f43f \
            lib/junit-platform-console-standalone-1.10.2.jar | shasum -a 256 -c -
          curl --fail --location --silent --show-error \
            --output lib/error_prone_core-2.51.0-with-dependencies.jar \
            https://repo1.maven.org/maven2/com/google/errorprone/error_prone_core/2.51.0/error_prone_core-2.51.0-with-dependencies.jar
          printf '%s  %s\n' \
            9a6aee2aa413500ac9314bfb22a30b6a4992aeb1156ddfd5f8d5c3dc280f1af1 \
            lib/error_prone_core-2.51.0-with-dependencies.jar | shasum -a 256 -c -
          find src/main/java -name '*.java' -print0 \
            | xargs -0 javac -J-Duser.language=en --release 21 $NCOH_JAVAC_FLAGS "$NCOH_ERROR_PRONE_PLUGIN" -sourcepath "$NCOH_NECO_QUOTIENT_JAVA:$NCOH_NECO_QUOTIENT_APPLICATION_JAVA:$NCOH_NECO_QUOTIENT_RETENTION_JAVA:$NCOH_NECO_QUOTIENT_ENCODING_JAVA" -d build/classes
          jar --create --file build/necoherence-0.3.0.jar -C build/classes .
          find src/test/java -name '*.java' -print0 \
            | xargs -0 javac -J-Duser.language=en --release 21 $NCOH_JAVAC_FLAGS "$NCOH_ERROR_PRONE_PLUGIN" \
                -sourcepath "$NCOH_NECO_QUOTIENT_JAVA:$NCOH_NECO_QUOTIENT_APPLICATION_JAVA:$NCOH_NECO_QUOTIENT_RETENTION_JAVA:$NCOH_NECO_QUOTIENT_ENCODING_JAVA" \
                -cp "build/necoherence-0.3.0.jar:lib/junit-platform-console-standalone-1.10.2.jar" \
                -d build/test-classes
          java -Duser.language=en -jar lib/junit-platform-console-standalone-1.10.2.jar execute \
            --class-path build/necoherence-0.3.0.jar:build/test-classes --scan-class-path
          mkdir -p ../../../verification/network_effect/java_driver/classes
          javac -J-Duser.language=en --release 21 $NCOH_JAVAC_FLAGS "$NCOH_ERROR_PRONE_PLUGIN" \
            -cp "build/necoherence-0.3.0.jar:lib/junit-platform-console-standalone-1.10.2.jar" \
            -d ../../../verification/network_effect/java_driver/classes \
            ../../../verification/network_effect/java_driver/NetworkEffectRunner.java \
            ../../../verification/network_effect/java_driver/NetworkEffectRunnerIntegerCheck.java
          java -Duser.language=en -jar lib/junit-platform-console-standalone-1.10.2.jar execute \
            --class-path build/necoherence-0.3.0.jar:../../../verification/network_effect/java_driver/classes \
            --select-class necoherence.network.NetworkEffectRunnerIntegerCheck

      - name: Run the main-form tests
        run: |
          for test in semantic.SemanticFormatTest semantic.SemanticGraphemeTest semantic.SemanticCalendarTest network.NetworkEffectTest; do
            java -Duser.language=en -cp packages/java/adapter/build/classes:packages/java/adapter/build/test-classes:packages/java/adapter/lib/junit-platform-console-standalone-1.10.2.jar "necoherence.$test"
          done

      - name: Build and test the separate HTTP adapter jar
        working-directory: packages/java/adapter/http
        run: |
          mkdir -p build/classes build/test-classes
          find src/main/java -name '*.java' -print0 \
            | xargs -0 javac --release 21 $NCOH_JAVAC_FLAGS "$NCOH_ERROR_PRONE_PLUGIN" -cp ../build/necoherence-0.3.0.jar -d build/classes
          jar --create --file build/necoherence-http-adapter-0.3.0.jar -C build/classes .
          find src/test/java -name '*.java' -print0 \
            | xargs -0 javac --release 21 $NCOH_JAVAC_FLAGS "$NCOH_ERROR_PRONE_PLUGIN" -cp ../build/necoherence-0.3.0.jar:build/classes -d build/test-classes
          for test in NetworkEffectHttpSmoke NetworkEffectProgressionSmoke; do
            java -cp ../build/necoherence-0.3.0.jar:build/classes:build/test-classes "necoherence.network.$test"
          done

      - name: Set up Java 21 for the Maven Central artifacts
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build the Maven Central artifacts
        run: sh packages/java/build-maven.sh build "$RUNNER_TEMP/maven"

  gleam:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Remove the tools to build the MIT package alone
        run: rm -rf generator solver verification/rust verification/lean
      - name: Read the Gleam version range from the package manifest
        id: gleam
        run: python3 -c "import tomllib; print('version=' + tomllib.load(open('packages/gleam/adapter/gleam.toml', 'rb'))['gleam'].replace(' and ', ' '))" >> "$GITHUB_OUTPUT"
      - name: Set up Erlang and Gleam
        uses: erlef/setup-beam@v1
        with:
          otp-version: "> 0"
          gleam-version: ${{ steps.gleam.outputs.version }}
          rebar3-version: "3"
      - name: Check, test, and build the package archive
        working-directory: packages/gleam/adapter
        run: |
          gleam format --check
          gleam build --warnings-as-errors
          gleam test
          gleam export hex-tarball
          archive=$(python3 -c 'import tomllib; package = tomllib.load(open("gleam.toml", "rb")); print("build/" + package["name"] + "-" + package["version"] + ".tar")')
          contents=$(mktemp -d)
          tar -xf "$archive" -C "$contents" contents.tar.gz
          test "$(tar -tzf "$contents/contents.tar.gz" | grep -Ec '^README\.md$')" -eq 1
      - name: Build and test the separate HTTP adapter
        working-directory: verification/network_effect/gleam_driver
        run: |
          gleam format --check
          gleam build --warnings-as-errors
          gleam test

  shared-operations:
    runs-on: ubuntu-latest
    env:
      NCOH_NECO_QUOTIENT_JAVA: ${{ github.workspace }}/../neco-quotient-certificate-0.2.0-sources
      NCOH_NECO_QUOTIENT_APPLICATION_JAVA: ${{ github.workspace }}/../neco-quotient-application-sources
      NCOH_NECO_QUOTIENT_RETENTION_JAVA: ${{ github.workspace }}/../neco-quotient-retention-sources
      NCOH_NECO_QUOTIENT_ENCODING_JAVA: ${{ github.workspace }}/../neco-quotient-encoding-sources
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Fetch the neco-quotient Java sources from Maven Central
        run: |
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/neco-quotient-certificate-0.2.0-sources.jar" \
            https://repo1.maven.org/maven2/io/github/barineco/neco-quotient-certificate/0.2.0/neco-quotient-certificate-0.2.0-sources.jar
          printf '%s  %s\n' dd477ac74974b3a676dd719cefdffe68f44bfb105025cb12282916efa6020e98 \
            "$RUNNER_TEMP/neco-quotient-certificate-0.2.0-sources.jar" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/neco-quotient-certificate-0.2.0-sources.jar" -d "$NCOH_NECO_QUOTIENT_JAVA"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/neco-quotient-application-0.1.0-sources.jar" \
            https://repo1.maven.org/maven2/io/github/barineco/neco-quotient-application/0.1.0/neco-quotient-application-0.1.0-sources.jar
          printf '%s  %s\n' 15f64a3fa26e07015adfca6f6c16320accdedca33b080bdf4a236a049cd81e41 \
            "$RUNNER_TEMP/neco-quotient-application-0.1.0-sources.jar" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/neco-quotient-application-0.1.0-sources.jar" -d "$NCOH_NECO_QUOTIENT_APPLICATION_JAVA"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/neco-quotient-retention-0.1.0-sources.jar" \
            https://repo1.maven.org/maven2/io/github/barineco/neco-quotient-retention/0.1.0/neco-quotient-retention-0.1.0-sources.jar
          printf '%s  %s\n' 7c514b0cb42d2f10a11e398be7a01e8aabb4bab867132c4fec18e160e01dfb5b \
            "$RUNNER_TEMP/neco-quotient-retention-0.1.0-sources.jar" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/neco-quotient-retention-0.1.0-sources.jar" -d "$NCOH_NECO_QUOTIENT_RETENTION_JAVA"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/neco-quotient-encoding-0.1.0-sources.jar" \
            https://repo1.maven.org/maven2/io/github/barineco/neco-quotient-encoding/0.1.0/neco-quotient-encoding-0.1.0-sources.jar
          printf '%s  %s\n' b58874a0c5131b2eceb649ff757befe30fa0c36856528c28635aab2b62c67e46 \
            "$RUNNER_TEMP/neco-quotient-encoding-0.1.0-sources.jar" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/neco-quotient-encoding-0.1.0-sources.jar" -d "$NCOH_NECO_QUOTIENT_ENCODING_JAVA"
      - name: Remove the tools to compare the MIT implementations alone
        run: rm -rf generator solver verification/rust verification/lean
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: packages/python/adapter/pyproject.toml
      - name: Install neco-quotient packages from PyPI
        run: |
          python -m pip install "neco-quotient-certificate==0.2.0" "neco-quotient-application==0.1.0" "neco-quotient-retention==0.1.0" "neco-quotient-encoding==0.1.0"
      - name: Read the Gleam version range from the package manifest
        id: gleam
        run: python -c "import tomllib; print('version=' + tomllib.load(open('packages/gleam/adapter/gleam.toml', 'rb'))['gleam'].replace(' and ', ' '))" >> "$GITHUB_OUTPUT"
      - name: Set up Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: "false"
          lake-package-directory: verification/shared_operations/lean_driver
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Set up wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: "50.0.1"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: packages/typescript/adapter/package-lock.json
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: x
      - name: Set up Erlang and Gleam
        uses: erlef/setup-beam@v1
        with:
          otp-version: "> 0"
          gleam-version: ${{ steps.gleam.outputs.version }}
      - name: Install the TypeScript dependencies
        working-directory: packages/typescript/adapter
        run: npm ci
      - name: Compare the six implementations on the shared operations
        run: python -m verification.shared_operations.differential
      - name: Check the per-operation fuel of the Rust state families
        run: python -m verification.shared_operations.rust_cost --repeat 3
      - name: Check the allocation counts of the Rust state families and prepared validation
        working-directory: verification/shared_operations/rust_driver
        run: cargo test --test state_machine_allocations --test borrowed_value_allocations
      - name: Check the per-operation cost of the TypeScript state families
        run: |
          npm --prefix packages/typescript/adapter run build
          python -m verification.shared_operations.ts_cost --repeat 3
      - name: Check the per-operation cost of the Java state families
        run: python -m verification.shared_operations.java_cost --repeat 3
      - name: Check the per-operation cost of the Python state families
        run: python -m verification.shared_operations.python_cost --repeat 3
      - name: Check the per-operation reductions of the Gleam state families
        run: python -m verification.shared_operations.gleam_cost --repeat 3

  network-effect:
    runs-on: ubuntu-latest
    env:
      NCOH_NECO_QUOTIENT_JAVA: ${{ github.workspace }}/../neco-quotient-certificate-0.2.0-sources
      NCOH_NECO_QUOTIENT_APPLICATION_JAVA: ${{ github.workspace }}/../neco-quotient-application-sources
      NCOH_NECO_QUOTIENT_RETENTION_JAVA: ${{ github.workspace }}/../neco-quotient-retention-sources
      NCOH_NECO_QUOTIENT_ENCODING_JAVA: ${{ github.workspace }}/../neco-quotient-encoding-sources
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Fetch the neco-quotient Java sources from Maven Central
        run: |
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/neco-quotient-certificate-0.2.0-sources.jar" \
            https://repo1.maven.org/maven2/io/github/barineco/neco-quotient-certificate/0.2.0/neco-quotient-certificate-0.2.0-sources.jar
          printf '%s  %s\n' dd477ac74974b3a676dd719cefdffe68f44bfb105025cb12282916efa6020e98 \
