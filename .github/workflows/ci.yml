            --source-manifest verification/presets/tools/unicode/source-manifest.json \
            --output "$temporary/preset-unicode.json"
          cmp "$temporary/comparison-unicode.json" "$temporary/preset-unicode.json"
          cp -R verification/presets "$temporary/presets"
          python "$temporary/presets/tools/generate.py"
          cmp verification/presets/atproto-data-model/profile.json \
            "$temporary/presets/atproto-data-model/profile.json"
          cmp verification/presets/manifest.json "$temporary/presets/manifest.json"

