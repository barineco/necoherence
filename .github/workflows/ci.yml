      - name: Install neco-quotient packages from PyPI
        run: |
          python -m pip install "neco-quotient-certificate==0.2.0" "neco-quotient-application==0.1.0" "neco-quotient-retention==0.1.0" "neco-quotient-encoding==0.1.0"
      - name: Read the Gleam version range from the package manifest
        id: gleam
        run: python -c "import tomllib; print('version=' + tomllib.load(open('packages/gleam/adapter/gleam.toml', 'rb'))['gleam'].replace(' and ', ' '))" >> "$GITHUB_OUTPUT"
      - name: Set up Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: "false"
          lake-package-directory: solver/lean
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: llvm-tools
      - name: Set up wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: "50.0.1"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: packages/typescript/adapter/package-lock.json
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Erlang and Gleam
        uses: erlef/setup-beam@v1
        with:
          otp-version: "> 0"
          gleam-version: ${{ steps.gleam.outputs.version }}
          rebar3-version: "3"
      - name: Compare the public solver implementations
        run: |
          python solver/verification/check.py --prepare-fixtures
          (
            cd solver/lean
            lake build NecoherenceSolver NecoherenceSolverTest
            TMS_FIXTURES=../verification/fixtures.json \
              lake env lean ../verification/lean_runner.lean \
              > ../verification/out-lean.json
          )
          cargo run --quiet --manifest-path solver/rust/Cargo.toml \
            --example typed_mapping_solver_compare -- \
            solver/verification/fixtures.json \
            > solver/verification/out-rust.json
          python solver/verification/check.py \
            --compare-public-producers \
              lean=out-lean.json rust=out-rust.json \
            --reject-local-producers \
            --reject-test-only-producers
      - name: Compare the typed mapping core operations of Lean and Gleam
        run: |
          python solver/verification/core_compare.py --prepare
          (
            cd solver/lean
            TMS_CASES=../verification/core_cases.json \
              lake env lean ../verification/core_runner.lean \
              > ../verification/core-lean.json
          )
          (
            cd solver/verification/gleam_driver
            gleam build --warnings-as-errors
            erl -noshell -pa build/dev/erlang/*/ebin \
              -eval 'typed_mapping_core_compare:main(), halt().' \
              < ../core_cases.json \
              > ../core-gleam.json
          )
          python solver/verification/core_compare.py --compare \
            solver/verification/core-lean.json solver/verification/core-gleam.json
      - name: Recheck the saved mutation classifications
        run: |
          python solver/verification/check.py \
            --mutation-classification \
            --fixtures solver/verification/fixtures.json \
            --mutation-results solver/verification/mutation-results.json \
            --oracle solver/verification/oracle.py \
            --lean-runner solver/verification/lean_runner.lean \
            --rust-runner solver/rust/examples/typed_mapping_solver_compare.rs \
            --lean-test solver/lean/NecoherenceSolverTest/TypedMappingSolverTest.lean \
            --rust-test solver/rust/tests/typed_mapping_solver_tests.rs \
            --require-coordinate binding-type \
            --require-coordinate multiplicity \
            --require-coordinate read-consume-mode \
            --require-coordinate identity \
            --require-coordinate index \
            --require-coordinate revision \
            --require-coordinate graph-edge \
            --require-coordinate input-binding \
            --require-coordinate token \
            --require-coordinate domain-bound \
            --require-coordinate input-place-membership \
            --require-coordinate binding-coverage \
            --require-coordinate cycle-closing-decrease \
            --require-invalidating-result Invalid \
            --require-preserving-result-equality \
            --require-bound-exhaustion-result Unknown \
            --require-unreachable-closure-witness \
            --reject-shared-oracle-implementation
          rm solver/verification/fixtures.json \
            solver/verification/out-lean.json \
            solver/verification/out-rust.json
      - name: Compare composition verification between Lean and Rust
        run: |
          (cd solver/composition/lean && lake build NecoherenceCompositionSolver @necoherence/Necoherence)
          python solver/composition/verification/check.py
      - name: Compare kernel and generated composition execution
        run: |
          (cd generator/lean && lake build NecoherenceGenerator @necoherence/Necoherence)
          npm --prefix packages/typescript/adapter ci
          npm --prefix packages/typescript/adapter run build
          sh packages/java/build-maven.sh build packages/java/adapter/build/maven
          (cd verification/execution/gleam_driver && gleam build)
          python verification/execution/check.py
      - name: Check that executions of inputs built from the rule definitions stay in the declared ranges
        run: python verification/execution/semantic_soundness.py
      - name: Count admission work after initialization in the generated code
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/asm-9.7.1.jar" \
            https://repo1.maven.org/maven2/org/ow2/asm/asm/9.7.1/asm-9.7.1.jar
          printf '%s  %s\n' \
            8cadd43ac5eb6d09de05faecca38b917a040bb9139c7edeb4cc81c740b713281 \
            "$RUNNER_TEMP/asm-9.7.1.jar" | shasum -a 256 -c -
          NCOH_ASM_JAR="$RUNNER_TEMP/asm-9.7.1.jar" python verification/execution/admission_once/check.py python typescript java rust gleam --gleam-threshold 1.000165
      - name: Reject a replaced generation document at initialization
        run: python verification/execution/admission_once/replaced_document.py rust python typescript java gleam

