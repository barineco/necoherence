licences = ["MIT"]

repository = { type = "github", user = "barineco", repo = "necoherence", path = "gleam-http-adapter" }
links = [{ title = "Homepage", href = "https://github.com/barineco/necoherence" }]

[dependencies]
necoherence = ">= 0.2.2 and < 0.3.0"
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
