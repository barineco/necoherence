[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "necoherence"
version = "0.2.1"
description = "Revision-aware state transition utilities for Python"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[project.urls]
Homepage = "https://github.com/barineco/necoherence"
Repository = "https://github.com/barineco/necoherence"
Issues = "https://github.com/barineco/necoherence/issues"

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "mypy"]

[tool.hatch.build.targets.wheel]
packages = ["src/necoherence"]

[tool.hatch.build.targets.wheel.force-include]
"README.md" = "necoherence/README.md"
"README-ja.md" = "necoherence/README-ja.md"

[tool.hatch.build.targets.sdist]
include = ["src/necoherence", "tests", "examples", "README.md", "README-ja.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.mypy]
mypy_path = "src"
