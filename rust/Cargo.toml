[package]
name = "necoherence"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Revision-aware state transition utilities"
rust-version = "1.88"

[lib]
path = "src/lib.rs"

[dependencies]
num-bigint = "0.4"
num-traits = "0.2"
ureq = "2.12"
serde_json = { version = "1", features = ["arbitrary_precision"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
