[package]
name = "necoherence"
version = "0.2.2"
edition = "2021"
license = "MIT"
description = "Revision-aware state transition utilities"
rust-version = "1.88"

repository = "https://github.com/barineco/necoherence"
homepage = "https://github.com/barineco/necoherence"
documentation = "https://docs.rs/necoherence"
readme = "README.md"

[lib]
path = "src/lib.rs"

[features]
default = []
http-adapter = ["dep:ureq", "dep:ureq-proto"]

[dependencies]
num-bigint = "0.4"
num-traits = "0.2"
ureq = { version = "3.4", features = ["platform-verifier"], optional = true }
ureq-proto = { version = "0.6", optional = true }
serde_json = { version = "1", features = ["arbitrary_precision"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[[test]]
name = "http_adapter_framing"
required-features = ["http-adapter"]

[[test]]
name = "network_effect_http_smoke"
required-features = ["http-adapter"]

[[test]]
name = "network_effect_progression"
required-features = ["http-adapter"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
