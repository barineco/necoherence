[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "necoherence-http-adapter"
version = "0.2.1"
description = "HTTP host adapter for Necoherence"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["necoherence==0.2.1"]

[project.urls]
Homepage = "https://github.com/barineco/necoherence"
Repository = "https://github.com/barineco/necoherence"
Issues = "https://github.com/barineco/necoherence/issues"

[project.optional-dependencies]
dev = ["pytest", "mypy"]

[tool.hatch.build.targets.wheel]
packages = ["src/necoherence_http_adapter"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
pythonpath = ["src", "../python/src"]

[tool.mypy]
mypy_path = "src:../python/src"
