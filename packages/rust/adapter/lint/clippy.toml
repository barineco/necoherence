# Add to the workspace Cargo.toml with [lints] workspace = true; rust/README.md describes the rules.

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
unreachable = "deny"
let_underscore_must_use = "deny"
