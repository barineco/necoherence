[package]
name = "necoherence-http-adapter"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "HTTP host adapter for necoherence"
rust-version = "1.88"

repository = "https://github.com/barineco/necoherence"
homepage = "https://github.com/barineco/necoherence"
documentation = "https://docs.rs/necoherence-http-adapter"
readme = "README.md"

[lib]
path = "src/lib.rs"

[dependencies]
necoherence = { version = "0.3.0", path = "../" }
ureq = { version = "3.4", features = ["platform-verifier"] }
ureq-proto = "0.6"

[dev-dependencies]
num-bigint = "0.4"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
