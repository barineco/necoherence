name = "necoherence-solver"
version = "0.3.0"
defaultTargets = ["NecoherenceSolver", "NecoherenceSolverTest"]

[[require]]
name = "necoherence"
path = "../../packages/lean"

[[lean_lib]]
name = "NecoherenceSolver"
roots = ["NecoherenceSolver.TypedMappingSolver", "NecoherenceSolver.TypedMappingWire"]

[[lean_lib]]
name = "NecoherenceSolverTest"
roots = ["NecoherenceSolverTest.TypedMappingSolverTest"]
