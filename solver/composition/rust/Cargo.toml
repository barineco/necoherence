[package]
name = "necoherence-composition-solver"
version = "0.3.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Composition search for necoherence"
rust-version = "1.88"

repository = "https://github.com/barineco/necoherence"
homepage = "https://github.com/barineco/necoherence"
documentation = "https://docs.rs/necoherence-composition-solver"
include = ["src/**", "LICENSE", "Cargo.toml", "Cargo.lock"]

[lib]
name = "necoherence_composition_solver"
path = "src/lib.rs"

[dependencies]
necoherence = { version = "0.3.0", path = "../../../packages/rust/adapter" }
necoherence-solver = { version = "0.3.0", path = "../../rust" }
num-bigint = "0.4"
num-traits = "0.2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
neco-quotient-certificate = "=0.2.0"

[dev-dependencies]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"

