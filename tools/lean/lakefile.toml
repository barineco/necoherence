name = "necoherence-tools"
version = "0.2.2"
defaultTargets = ["NecoherenceTools", "NecoherenceToolsTest"]

[[require]]
name = "necoherence"
path = "../../lean"

[[lean_lib]]
name = "NecoherenceTools"
globs = ["NecoherenceTools", "NecoherenceTools.+"]

[[lean_lib]]
name = "NecoherenceToolsTest"
roots = ["NecoherenceToolsTests.TypedMappingSolverTest", "NecoherenceToolsTests.TypeSignatures", "NecoherenceToolsTests.SignatureExchange", "NecoherenceToolsTests.SignatureCompositionWire"]

[[lean_exe]]
name = "semantic_generation"
root = "NecoherenceTools.SemanticGenerationRunner"

[[lean_exe]]
name = "signature_generation_tests"
root = "NecoherenceToolsTests.SignatureGeneration"

[[lean_exe]]
name = "semantic_invariant"
root = "NecoherenceTools.SemanticInvariantRunner"
