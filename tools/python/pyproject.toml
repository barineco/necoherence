[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "necoherence-tools"
version = "0.2.2"
description = "Code generators for necoherence"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = ["necoherence"]

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "mypy"]

[tool.hatch.build.targets.wheel]
packages = ["src/necoherence_tools"]

[tool.hatch.build.targets.sdist]
include = ["src/necoherence_tools", "tests", "semantic_invariant_adapter.py", "pyproject.toml"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.mypy]
mypy_path = "src:../../python/src:../../python/tests"
